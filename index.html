<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>码力全开!</title>
    <link rel="preconnect" href="https://fonts.font.im">
    <link rel="stylesheet" href="https://fonts.font.im/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Noto+Sans+SC:wght@100..900&display=swap">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #00e676;
            color: #000000;
            font-family: "Google Sans", "Noto Sans SC", sans-serif;
            min-height: 100vh;
            /* 水平+垂直居中 */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 1.25rem;
            transition: all 0.3s ease-in-out;
        }
        body:hover {
            background-color: #ff0000;
            color: #ffffff;
        }
        .content {
            font-weight: 900;
            font-size: 4rem;
            text-align: center;
        }
        .content2 {
            font-size: 2rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="content">
        码力全开!
    </div>
    <div class="content2">
        Full Power!
    </div>
    <script>
        document.body.addEventListener('mouseover', function() {
            document.querySelector('.content').textContent = '不要摸鱼!';
            document.querySelector('.content2').textContent = 'No Fish!';
        });
        document.body.addEventListener('mouseout', function() {
            document.querySelector('.content').textContent = '码力全开!';
            document.querySelector('.content2').textContent = 'Full Power!';
        });
    </script>
</body>
</html>
